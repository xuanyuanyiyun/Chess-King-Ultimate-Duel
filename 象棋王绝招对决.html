<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>象棋王：绝招对决 v2.1</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.8);
            --primary: #38bdf8;
            --red: #ef4444;
            --black: #94a3b8;
            --text: #f8fafc;
            --border: #334155;
            /* Safe area variables for modern mobile devices (iOS/HarmonyOS) */
            --safe-area-inset-top: env(safe-area-inset-top, 0px);
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed; /* Prevent pull-to-refresh on mobile */
        }

        body {
            background-color: var(--bg-color); color: var(--text); display: flex; flex-direction: column; align-items: center; 
            background-image: radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.1) 0%, transparent 50%), linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9));
        }

        /* 主菜单 */
        #main-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--bg-color); z-index: 200;
            background-image: radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.2) 0%, transparent 70%);
        }
        .menu-title { font-size: 2rem; color: var(--primary); text-shadow: 0 0 15px var(--primary); margin-bottom: 40px; text-align: center; padding: 0 20px; }
        .menu-btn {
            width: 85%; max-width: 320px; padding: 16px; margin: 10px 0; font-size: 1.1rem; font-weight: bold; background: var(--panel-bg); color: var(--text); border: 2px solid var(--primary); border-radius: 12px; cursor: pointer; transition: all 0.2s;
            /* Touch target optimization */
            min-height: 54px;
        }
        .menu-btn:active { background: rgba(56, 189, 248, 0.3); box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); transform: scale(0.98); }

        /* 游戏界面 */
        #game-container { 
            display: none; flex-direction: column; align-items: center; width: 100%; max-width: 600px; 
            padding: calc(10px + var(--safe-area-inset-top)) 10px calc(10px + var(--safe-area-inset-bottom)) 10px; 
            height: 100%; 
        }
        
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--panel-bg); border: 1px solid var(--primary); border-radius: 8px; margin-bottom: 8px; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); flex-shrink: 0; }
        .title { font-size: 1.1rem; font-weight: bold; color: var(--primary); text-shadow: 0 0 5px var(--primary); }
        .stats { display: flex; gap: 10px; font-size: 0.85rem; }
        
        .status-panel { width: 100%; display: flex; justify-content: space-between; margin-bottom: 8px; flex-shrink: 0; gap: 8px; }
        .player-card { background: var(--panel-bg); padding: 8px 10px; border-radius: 8px; flex: 1; border: 1px solid var(--border); transition: border-color 0.3s, box-shadow 0.3s; display: flex; flex-direction: column; justify-content: space-between; }
        .player-card.active { border-color: var(--primary); box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        .player-name { font-weight: bold; margin-bottom: 5px; display: flex; justify-content: space-between; font-size: 0.8rem; }
        .red-text { color: var(--red); }
        .black-text { color: var(--black); }
        
        .energy-bar-container { width: 100%; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; margin-bottom: 5px; }
        .energy-bar { height: 100%; width: 0%; transition: width 0.3s ease; }
        .energy-red { background: linear-gradient(90deg, #b91c1c, #ef4444); }
        .energy-black { background: linear-gradient(90deg, #475569, #94a3b8); }
        
        .skill-btn { width: 100%; padding: 6px; background: #1e293b; color: #64748b; border: 1px solid var(--border); border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: not-allowed; transition: all 0.3s; touch-action: manipulation; }
        .skill-btn.ready { background: rgba(56, 189, 248, 0.2); color: var(--primary); border-color: var(--primary); cursor: pointer; box-shadow: 0 0 8px rgba(56, 189, 248, 0.5); animation: pulse 1.5s infinite; }
        .skill-btn.ready:active { transform: scale(0.95); }
        @keyframes pulse { 0% { box-shadow: 0 0 5px rgba(56, 189, 248, 0.4); } 50% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.8); } 100% { box-shadow: 0 0 5px rgba(56, 189, 248, 0.4); } }

        /* 使棋盘区域自适应剩余空间并保持比例 */
        #board-container { 
            position: relative; 
            width: 100%; 
            flex: 1; /* 占据剩余空间 */
            min-height: 0; /* 允许 flex 容器缩放 */
            margin: 5px 0; 
            background: rgba(15, 23, 42, 0.5); 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none; /* 阻止 Canvas 上的默认浏览器触摸行为 */
        }
        canvas { display: block; position: absolute; }
        #game-canvas { z-index: 1; }
        #skill-effect { z-index: 5; pointer-events: none; }

        .controls { width: 100%; display: flex; justify-content: space-between; gap: 8px; margin-top: 5px; flex-shrink: 0; padding-bottom: 5px; }
        .btn { flex: 1; padding: 10px 5px; background: var(--panel-bg); color: var(--text); border: 1px solid var(--primary); border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: bold; transition: all 0.2s; white-space: nowrap; display: flex; justify-content: center; align-items: center; }
        .btn:active { background: rgba(56, 189, 248, 0.3); transform: scale(0.95); }

        #message-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.8rem; font-weight: bold; color: var(--primary); text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary); pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 10; text-align: center; white-space: nowrap; width: 100%; }
        .show-message { opacity: 1 !important; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); justify-content: center; align-items: center; z-index: 300; padding: 20px; }
        .modal-content { background: var(--bg-color); border: 1px solid var(--primary); padding: 25px 20px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); text-align: center; }
        .modal h2 { color: var(--primary); margin-bottom: 15px; font-size: 1.4rem; }
        .modal p { margin-bottom: 25px; line-height: 1.6; font-size: 0.95rem; text-align: left; color: #cbd5e1; }
    </style>
</head>
<body>

<!-- 主菜单 -->
<div id="main-menu">
    <h1 class="menu-title">象棋王：绝招对决</h1>
    <button id="btn-start-ai" class="menu-btn">🤖 人机对决</button>
    <button id="btn-start-pvp" class="menu-btn">⚔️ 双人同屏</button>
    <button id="btn-menu-help" class="menu-btn" style="margin-top: 20px; font-size: 1rem; border-color: var(--border); color: #94a3b8;">📖 游戏规则</button>
</div>

<!-- 游戏容器 -->
<div id="game-container">
    <div class="header">
        <div class="title" id="game-mode-title">人机对决</div>
        <div class="stats">
            <span>胜: <span id="win-count" class="red-text">0</span></span>
            <span>负: <span id="loss-count" class="black-text">0</span></span>
        </div>
    </div>

    <div class="status-panel">
        <div id="black-card" class="player-card">
            <div class="player-name">
                <span class="black-text" id="black-name">天网 AI</span>
                <span id="black-energy-text">0/100</span>
            </div>
            <div class="energy-bar-container">
                <div id="black-energy" class="energy-bar energy-black"></div>
            </div>
            <button id="btn-black-skill" class="skill-btn" disabled>暗影突袭 (100)</button>
        </div>
        
        <div id="red-card" class="player-card active">
            <div class="player-name">
                <span class="red-text" id="red-name">聂无悔</span>
                <span id="red-energy-text">0/100</span>
            </div>
            <div class="energy-bar-container">
                <div id="red-energy" class="energy-bar energy-red"></div>
            </div>
            <button id="btn-red-skill" class="skill-btn" disabled>天地同寿 (100)</button>
        </div>
    </div>

    <div id="board-container">
        <canvas id="game-canvas"></canvas>
        <canvas id="skill-effect"></canvas>
        <div id="message-overlay"></div>
    </div>

    <div class="controls">
        <button id="btn-flip" class="btn">🔄 翻转</button>
        <button id="btn-undo" class="btn">↩️ 悔棋</button>
        <button id="btn-restart" class="btn">🔁 重开</button>
        <button id="btn-exit" class="btn" style="border-color: var(--red); color: var(--red);">退出</button>
    </div>
</div>

<!-- 规则弹窗 -->
<div id="help-modal" class="modal">
    <div class="modal-content">
        <h2>绝招对决 规则</h2>
        <p>
            1. 经典中国象棋规则，红方先行。<br>
            2. <strong>能量机制</strong>：每走一步积攒10点能量，吃子积攒20点。上限100点。<br>
            3. <strong>红方绝招【天地同寿】</strong>：满能量手动发动，牺牲己方1个非将帅棋子，摧毁对方1个非将帅棋子。<br>
            4. <strong>黑方绝招【暗影突袭】</strong>：效果同上。人机模式由AI自动发动。<br>
            5. <strong>双人同屏</strong>：支持两人轮流操作，可使用“翻转”按钮互换视角。
        </p>
        <button id="btn-close-help" class="menu-btn" style="width: 100%; margin: 0;">我明白了</button>
    </div>
</div>

<script>
/**
 * 象棋王：绝招对决 v2.1
 * 移动端优化版：全面兼容安卓、鸿蒙、iOS，支持触摸交互，自适应各尺寸屏幕
 */

(function() {
    // 阻止移动端的双击缩放和默认手势
    document.addEventListener('touchstart', function(event) {
        if (event.touches.length > 1) {
            event.preventDefault();
        }
    }, { passive: false });
    
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
            event.preventDefault();
        }
        lastTouchEnd = now;
    }, { passive: false });

    // --- 核心配置与状态 ---
    const CONFIG = {
        boardCols: 9,
        boardRows: 10,
        colors: {
            board: '#0f172a', grid: '#1e293b', gridLine: '#38bdf8',
            red: '#ef4444', redGlow: 'rgba(239, 68, 68, 0.6)',
            black: '#94a3b8', blackGlow: 'rgba(148, 163, 184, 0.6)',
            highlight: 'rgba(56, 189, 248, 0.4)',
            select: 'rgba(250, 204, 21, 0.6)',
            validMove: 'rgba(34, 197, 94, 0.6)',
            boardText: 'rgba(56, 189, 248, 0.3)'
        },
        // 动态计算的尺寸
        renderSize: { w: 0, h: 0, cellSize: 0, offsetX: 0, offsetY: 0 }
    };

    let state = {
        mode: 'ai', // 'ai' | 'pvp'
        board: [], 
        turn: 'red',
        selectedPiece: null,
        validMoves: [],
        history: [],
        gameOver: false,
        redEnergy: 0,
        blackEnergy: 0,
        stats: { wins: 0, losses: 0 },
        isFlipped: false
    };

    // DOM 元素
    const UI = {
        menu: document.getElementById('main-menu'),
        game: document.getElementById('game-container'),
        boardContainer: document.getElementById('board-container'),
        canvas: document.getElementById('game-canvas'),
        ctx: document.getElementById('game-canvas').getContext('2d'),
        effectCanvas: document.getElementById('skill-effect'),
        effectCtx: document.getElementById('skill-effect').getContext('2d'),
        msg: document.getElementById('message-overlay'),
        modeTitle: document.getElementById('game-mode-title'),
        blackName: document.getElementById('black-name'),
        btnRedSkill: document.getElementById('btn-red-skill'),
        btnBlackSkill: document.getElementById('btn-black-skill')
    };

    const PIECES = {
        'r_jiang': { text: '帅', type: 'jiang', color: 'red' },
        'r_shi': { text: '仕', type: 'shi', color: 'red' },
        'r_xiang': { text: '相', type: 'xiang', color: 'red' },
        'r_ma': { text: '马', type: 'ma', color: 'red' },
        'r_che': { text: '车', type: 'che', color: 'red' },
        'r_pao': { text: '炮', type: 'pao', color: 'red' },
        'r_bing': { text: '兵', type: 'bing', color: 'red' },
        
        'b_jiang': { text: '将', type: 'jiang', color: 'black' },
        'b_shi': { text: '士', type: 'shi', color: 'black' },
        'b_xiang': { text: '象', type: 'xiang', color: 'black' },
        'b_ma': { text: '马', type: 'ma', color: 'black' },
        'b_che': { text: '车', type: 'che', color: 'black' },
        'b_pao': { text: '炮', type: 'pao', color: 'black' },
        'b_bing': { text: '卒', type: 'bing', color: 'black' }
    };

    // --- 初始化 ---

    function init() {
        loadStats();
        
        // 监听窗口大小变化和屏幕旋转
        window.addEventListener('resize', () => {
            if (UI.game.style.display !== 'none') {
                // 稍微延迟以确保容器尺寸已更新（处理某些移动端浏览器的延迟）
                setTimeout(resizeCanvas, 100);
            }
        });
        window.addEventListener('orientationchange', () => {
            setTimeout(resizeCanvas, 200);
        });
        
        // 支持鼠标点击和触摸事件
        UI.canvas.addEventListener('pointerdown', handleBoardClick);
        
        // 菜单事件
        document.getElementById('btn-start-ai').addEventListener('click', () => startGame('ai'));
        document.getElementById('btn-start-pvp').addEventListener('click', () => startGame('pvp'));
        
        // 游戏控制事件
        document.getElementById('btn-restart').addEventListener('click', () => startGame(state.mode));
        document.getElementById('btn-undo').addEventListener('click', undoMove);
        document.getElementById('btn-flip').addEventListener('click', () => {
            state.isFlipped = !state.isFlipped;
            drawBoard();
        });
        document.getElementById('btn-exit').addEventListener('click', () => {
            UI.game.style.display = 'none';
            UI.menu.style.display = 'flex';
        });
        
        // 技能事件
        UI.btnRedSkill.addEventListener('click', () => useSkill('red'));
        UI.btnBlackSkill.addEventListener('click', () => useSkill('black'));
        
        // 规则说明
        const showHelp = () => document.getElementById('help-modal').style.display = 'flex';
        document.getElementById('btn-menu-help').addEventListener('click', showHelp);
        document.getElementById('btn-close-help').addEventListener('click', () => {
            document.getElementById('help-modal').style.display = 'none';
        });

        requestAnimationFrame(renderLoop);
    }

    function loadStats() {
        try {
            state.stats.wins = parseInt(localStorage.getItem('xw_wins') || 0);
            state.stats.losses = parseInt(localStorage.getItem('xw_losses') || 0);
            updateStatsUI();
        } catch(e) {}
    }

    function saveStats() {
        try {
            localStorage.setItem('xw_wins', state.stats.wins);
            localStorage.setItem('xw_losses', state.stats.losses);
            updateStatsUI();
        } catch(e) {}
    }

    function updateStatsUI() {
        document.getElementById('win-count').textContent = state.stats.wins;
        document.getElementById('loss-count').textContent = state.stats.losses;
    }

    function resizeCanvas() {
        if (UI.game.style.display === 'none') return;
        
        const container = UI.boardContainer;
        const rect = container.getBoundingClientRect();
        
        // 计算最佳棋盘尺寸（保持 9:10 比例）
        let targetW = rect.width;
        let targetH = targetW * (10 / 9);
        
        if (targetH > rect.height) {
            targetH = rect.height;
            targetW = targetH * (9 / 10);
        }
        
        // 居中偏移
        const padX = (rect.width - targetW) / 2;
        const padY = (rect.height - targetH) / 2;
        
        const dpr = window.devicePixelRatio || 1;
        
        UI.canvas.width = rect.width * dpr;
        UI.canvas.height = rect.height * dpr;
        UI.effectCanvas.width = rect.width * dpr;
        UI.effectCanvas.height = rect.height * dpr;
        
        // CSS 实际显示尺寸
        UI.canvas.style.width = `${rect.width}px`;
        UI.canvas.style.height = `${rect.height}px`;
        UI.effectCanvas.style.width = `${rect.width}px`;
        UI.effectCanvas.style.height = `${rect.height}px`;
        
        UI.ctx.scale(dpr, dpr);
        UI.effectCtx.scale(dpr, dpr);
        
        // 留出边缘内边距 (padding) 绘制棋盘
        const boardPadding = targetW * 0.05; 
        const usableW = targetW - boardPadding * 2;
        const usableH = targetH - boardPadding * 2;
        
        CONFIG.renderSize.cellSize = Math.min(usableW / 8, usableH / 9);
        CONFIG.renderSize.w = CONFIG.renderSize.cellSize * 8;
        CONFIG.renderSize.h = CONFIG.renderSize.cellSize * 9;
        
        CONFIG.renderSize.offsetX = padX + (targetW - CONFIG.renderSize.w) / 2;
        CONFIG.renderSize.offsetY = padY + (targetH - CONFIG.renderSize.h) / 2;
        
        drawBoard();
    }

    function startGame(mode) {
        state.mode = mode;
        state.isFlipped = false;
        
        UI.menu.style.display = 'none';
        UI.game.style.display = 'flex';
        
        if (mode === 'ai') {
            UI.modeTitle.textContent = "人机对决";
            UI.blackName.textContent = "天网 AI";
            UI.btnBlackSkill.style.display = 'none'; 
        } else {
            UI.modeTitle.textContent = "双人同屏";
            UI.blackName.textContent = "玩家2 (黑方)";
            UI.btnBlackSkill.style.display = 'block';
        }

        // 初始化棋盘
        state.board = Array(10).fill(null).map(() => Array(9).fill(null));
        state.board[0] = ['b_che', 'b_ma', 'b_xiang', 'b_shi', 'b_jiang', 'b_shi', 'b_xiang', 'b_ma', 'b_che'];
        state.board[2][1] = 'b_pao'; state.board[2][7] = 'b_pao';
        state.board[3][0] = 'b_bing'; state.board[3][2] = 'b_bing'; state.board[3][4] = 'b_bing'; state.board[3][6] = 'b_bing'; state.board[3][8] = 'b_bing';

        state.board[9] = ['r_che', 'r_ma', 'r_xiang', 'r_shi', 'r_jiang', 'r_shi', 'r_xiang', 'r_ma', 'r_che'];
        state.board[7][1] = 'r_pao'; state.board[7][7] = 'r_pao';
        state.board[6][0] = 'r_bing'; state.board[6][2] = 'r_bing'; state.board[6][4] = 'r_bing'; state.board[6][6] = 'r_bing'; state.board[6][8] = 'r_bing';

        state.turn = 'red';
        state.selectedPiece = null;
        state.validMoves = [];
        state.history = [];
        state.gameOver = false;
        state.redEnergy = 0;
        state.blackEnergy = 0;
        
        // 延迟调用以确保布局计算正确
        setTimeout(() => {
            resizeCanvas();
            updateUI();
            showMessage(mode === 'ai' ? "对决开始！" : "双人联机！", 1500);
        }, 50);
    }

    function saveHistory() {
        state.history.push({
            board: JSON.parse(JSON.stringify(state.board)),
            redEnergy: state.redEnergy,
            blackEnergy: state.blackEnergy,
            turn: state.turn
        });
    }

    function undoMove() {
        if (state.gameOver || state.history.length === 0) return;
        
        if (state.mode === 'ai') {
            if (state.history.length < 2 || state.turn !== 'red') return;
            state.history.pop();
            restoreState(state.history.pop());
        } else {
            restoreState(state.history.pop());
        }
        updateUI();
        drawBoard();
    }

    function restoreState(prevState) {
        state.board = prevState.board;
        state.redEnergy = prevState.redEnergy;
        state.blackEnergy = prevState.blackEnergy;
        state.turn = prevState.turn;
        state.selectedPiece = null;
        state.validMoves = [];
    }

    // --- 坐标转换 ---
    function getRenderPos(r, c) { return state.isFlipped ? { r: 9 - r, c: 8 - c } : { r, c }; }
    function getLogicPos(renderR, renderC) { return state.isFlipped ? { r: 9 - renderR, c: 8 - renderC } : { r: renderR, c: renderC }; }

    // --- 游戏规则逻辑 ---
    function getPieceColor(id) { return id ? (id.startsWith('r_') ? 'red' : 'black') : null; }
    function getPieceType(id) { return id ? id.substring(2) : null; }

    function calculateValidMoves(r, c) {
        const pieceId = state.board[r][c];
        if (!pieceId) return [];
        const color = getPieceColor(pieceId), type = getPieceType(pieceId);
        const moves = [];

        const addMove = (nr, nc) => {
            if (nr >= 0 && nr < 10 && nc >= 0 && nc < 9) {
                const tgt = state.board[nr][nc];
                if (!tgt || getPieceColor(tgt) !== color) moves.push({r: nr, c: nc});
            }
        };

        if (type === 'che') {
            for (let i=r-1; i>=0; i--) { addMove(i,c); if(state.board[i][c]) break; }
            for (let i=r+1; i<10; i++) { addMove(i,c); if(state.board[i][c]) break; }
            for (let i=c-1; i>=0; i--) { addMove(r,i); if(state.board[r][i]) break; }
            for (let i=c+1; i<9; i++) { addMove(r,i); if(state.board[r][i]) break; }
        } else if (type === 'ma') {
            [{dr:-2,dc:-1,br:-1,bc:0},{dr:-2,dc:1,br:-1,bc:0},{dr:2,dc:-1,br:1,bc:0},{dr:2,dc:1,br:1,bc:0},
             {dr:-1,dc:-2,br:0,bc:-1},{dr:1,dc:-2,br:0,bc:-1},{dr:-1,dc:2,br:0,bc:1},{dr:1,dc:2,br:0,bc:1}]
            .forEach(d => { if(r+d.br>=0 && r+d.br<10 && c+d.bc>=0 && c+d.bc<9 && !state.board[r+d.br][c+d.bc]) addMove(r+d.dr, c+d.dc); });
        } else if (type === 'xiang') {
            [{dr:-2,dc:-2,br:-1,bc:-1},{dr:-2,dc:2,br:-1,bc:1},{dr:2,dc:-2,br:1,bc:-1},{dr:2,dc:2,br:1,bc:1}]
            .forEach(d => {
                const nr = r+d.dr, nc = c+d.dc;
                if((color==='red' && nr<5) || (color==='black' && nr>4)) return;
                if(r+d.br>=0 && r+d.br<10 && c+d.bc>=0 && c+d.bc<9 && !state.board[r+d.br][c+d.bc]) addMove(nr, nc);
            });
        } else if (type === 'shi') {
            [{dr:-1,dc:-1},{dr:-1,dc:1},{dr:1,dc:-1},{dr:1,dc:1}].forEach(d => {
                const nr=r+d.dr, nc=c+d.dc;
                if(nc>=3 && nc<=5 && ((color==='red' && nr>=7 && nr<=9) || (color==='black' && nr>=0 && nr<=2))) addMove(nr, nc);
            });
        } else if (type === 'jiang') {
            [{dr:-1,dc:0},{dr:1,dc:0},{dr:0,dc:-1},{dr:0,dc:1}].forEach(d => {
                const nr=r+d.dr, nc=c+d.dc;
                if(nc>=3 && nc<=5 && ((color==='red' && nr>=7 && nr<=9) || (color==='black' && nr>=0 && nr<=2))) addMove(nr, nc);
            });
        } else if (type === 'pao') {
            const calcLine = (dr, dc) => {
                let jump = false, cr = r+dr, cc = c+dc;
                while(cr>=0 && cr<10 && cc>=0 && cc<9) {
                    if(!state.board[cr][cc]) { if(!jump) addMove(cr,cc); }
                    else {
                        if(!jump) jump = true;
                        else { if(getPieceColor(state.board[cr][cc]) !== color) addMove(cr,cc); break; }
                    }
                    cr+=dr; cc+=dc;
                }
            };
            calcLine(-1,0); calcLine(1,0); calcLine(0,-1); calcLine(0,1);
        } else if (type === 'bing') {
            const dr = color === 'red' ? -1 : 1;
            addMove(r+dr, c);
            if((color==='red' && r<5) || (color==='black' && r>4)) { addMove(r, c-1); addMove(r, c+1); }
        }
        return moves;
    }

    // --- 交互与执行 ---

    function handleBoardClick(e) {
        if (state.gameOver) return;
        if (state.mode === 'ai' && state.turn !== 'red') return;

        // 支持 pointer 事件以完美兼容移动端触摸
        e.preventDefault();
        
        const rect = UI.canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const { offsetX, offsetY, cellSize } = CONFIG.renderSize;
        
        // 增加触摸判定范围 (容错率)
        const touchTolerance = cellSize * 0.4;
        
        let targetRenderC = -1;
        let targetRenderR = -1;
        let minDistance = touchTolerance;
        
        // 遍历寻找最近的交叉点
        for(let r=0; r<10; r++) {
            for(let c=0; c<9; c++) {
                const pX = offsetX + c * cellSize;
                const pY = offsetY + r * cellSize;
                const dist = Math.sqrt(Math.pow(x - pX, 2) + Math.pow(y - pY, 2));
                if(dist < minDistance) {
                    minDistance = dist;
                    targetRenderC = c;
                    targetRenderR = r;
                }
            }
        }

        if (targetRenderR === -1 || targetRenderC === -1) return;

        const { r, c } = getLogicPos(targetRenderR, targetRenderC);
        const piece = state.board[r][c];

        if (state.selectedPiece) {
            const sr = state.selectedPiece.r, sc = state.selectedPiece.c;
            if (state.validMoves.some(m => m.r === r && m.c === c)) {
                executeMove(sr, sc, r, c);
                return;
            }
        }

        if (piece && getPieceColor(piece) === state.turn) {
            state.selectedPiece = {r, c};
            state.validMoves = calculateValidMoves(r, c);
        } else {
            state.selectedPiece = null;
            state.validMoves = [];
        }
        drawBoard();
    }

    function executeMove(sr, sc, dr, dc) {
        saveHistory();
        
        const piece = state.board[sr][sc];
        const target = state.board[dr][dc];
        
        state.board[dr][dc] = piece;
        state.board[sr][sc] = null;
        
        let gain = target ? 20 : 10;
        if (state.turn === 'red') state.redEnergy = Math.min(100, state.redEnergy + gain);
        else state.blackEnergy = Math.min(100, state.blackEnergy + gain);

        state.selectedPiece = null;
        state.validMoves = [];

        if (target === 'b_jiang') { endGame('red'); return; }
        if (target === 'r_jiang') { endGame('black'); return; }

        state.turn = state.turn === 'red' ? 'black' : 'red';
        updateUI();
        drawBoard();

        if (state.mode === 'ai' && state.turn === 'black' && !state.gameOver) {
            setTimeout(playAITurn, 600);
        }
    }

    // --- AI 逻辑 ---
    function playAITurn() {
        if (state.gameOver) return;

        if (state.blackEnergy >= 100) {
            useSkill('black');
            return;
        }

        const moves = [];
        for (let r=0; r<10; r++) {
            for (let c=0; c<9; c++) {
                if (getPieceColor(state.board[r][c]) === 'black') {
                    calculateValidMoves(r, c).forEach(m => {
                        let score = 0;
                        const t = state.board[m.r][m.c];
                        if (t) {
                            const ty = getPieceType(t);
                            if(ty==='jiang') score+=1000; else if(ty==='che') score+=90; else if(ty==='pao'||ty==='ma') score+=45; else score+=15;
                        }
                        score += Math.random() * 5;
                        moves.push({sr: r, sc: c, dr: m.r, dc: m.c, score});
                    });
                }
            }
        }

        if (moves.length > 0) {
            moves.sort((a, b) => b.score - a.score);
            executeMove(moves[0].sr, moves[0].sc, moves[0].dr, moves[0].dc);
        }
    }

    // --- 绝招系统 ---
    function useSkill(color) {
        if (state.gameOver || state.turn !== color) return;
        if (color === 'red' && state.redEnergy < 100) return;
        if (color === 'black' && state.blackEnergy < 100) return;

        const myPieces = [], enemyPieces = [];
        for (let r=0; r<10; r++) {
            for (let c=0; c<9; c++) {
                const p = state.board[r][c];
                if (p && getPieceType(p) !== 'jiang') {
                    if (getPieceColor(p) === color) myPieces.push({r, c});
                    else enemyPieces.push({r, c});
                }
            }
        }

        if (myPieces.length > 0 && enemyPieces.length > 0) {
            saveHistory();
            if (color === 'red') state.redEnergy = 0; else state.blackEnergy = 0;
            
            const sac = myPieces[Math.floor(Math.random() * myPieces.length)];
            const tgt = enemyPieces[Math.floor(Math.random() * enemyPieces.length)];
            
            state.board[sac.r][sac.c] = null;
            state.board[tgt.r][tgt.c] = null;
            
            playSkillAnimation(color === 'red' ? '天地同寿!' : '暗影突袭!', color === 'red' ? '#ef4444' : '#94a3b8');
            
            state.turn = state.turn === 'red' ? 'black' : 'red';
            updateUI();
            drawBoard();
            
            if (state.mode === 'ai' && state.turn === 'black') {
                setTimeout(playAITurn, 1500);
            }
        } else {
            showMessage("场上无可用祭品或目标！", 1000);
        }
    }

    function playSkillAnimation(text, color) {
        const w = UI.effectCanvas.width, h = UI.effectCanvas.height;
        let frame = 0;
        
        // 移动端缩放字体大小
        const fontSize = Math.min(w / 6, 60);
        
        function anim() {
            UI.effectCtx.clearRect(0, 0, w, h);
            if (frame < 60) {
                const alpha = frame < 10 ? frame/10 : (frame > 50 ? (60-frame)/10 : 1);
                const scale = 1 + (frame/60)*0.5;
                UI.effectCtx.save();
                UI.effectCtx.globalAlpha = alpha;
                UI.effectCtx.translate(w/2, h/2);
                UI.effectCtx.scale(scale, scale);
                UI.effectCtx.font = `bold ${fontSize}px Arial`;
                UI.effectCtx.textAlign = "center"; UI.effectCtx.textBaseline = "middle";
                UI.effectCtx.fillStyle = color; UI.effectCtx.shadowColor = color; UI.effectCtx.shadowBlur = 20;
                UI.effectCtx.fillText(text, 0, 0);
                UI.effectCtx.restore();
                frame++; requestAnimationFrame(anim);
            } else { UI.effectCtx.clearRect(0, 0, w, h); }
        }
        anim();
    }

    // --- 界面与渲染 ---
    function endGame(winner) {
        state.gameOver = true;
        if (winner === 'red') { state.stats.wins++; showMessage("红方 胜！", 3000); }
        else { state.stats.losses++; showMessage("黑方 胜！", 3000); }
        saveStats(); updateUI();
    }

    function showMessage(text, duration) {
        UI.msg.textContent = text;
        UI.msg.className = 'show-message';
        setTimeout(() => { UI.msg.className = ''; }, duration);
    }

    function updateUI() {
        document.getElementById('red-energy').style.width = state.redEnergy + '%';
        document.getElementById('black-energy').style.width = state.blackEnergy + '%';
        document.getElementById('red-energy-text').textContent = state.redEnergy + '/100';
        document.getElementById('black-energy-text').textContent = state.blackEnergy + '/100';

        const setSkillBtn = (btn, en, isActiveTurn) => {
            if (en >= 100 && isActiveTurn) { btn.disabled = false; btn.classList.add('ready'); }
            else { btn.disabled = true; btn.classList.remove('ready'); }
        };

        setSkillBtn(UI.btnRedSkill, state.redEnergy, state.turn === 'red');
        setSkillBtn(UI.btnBlackSkill, state.blackEnergy, state.turn === 'black' && state.mode !== 'ai');

        const rc = document.getElementById('red-card'), bc = document.getElementById('black-card');
        if (state.turn === 'red') { rc.classList.add('active'); bc.classList.remove('active'); }
        else { bc.classList.add('active'); rc.classList.remove('active'); }
    }

    // 使用标志位优化重绘频率
    let needsRedraw = false;
    function renderLoop() {
        if (needsRedraw && UI.game.style.display !== 'none') {
            drawBoard();
            needsRedraw = false;
        }
        requestAnimationFrame(renderLoop);
    }

    function drawCrossMarks(ox, oy, cs) {
        UI.ctx.strokeStyle = CONFIG.colors.gridLine;
        UI.ctx.lineWidth = 1.5;

        const drawMark = (logicR, logicC, hideLeft=false, hideRight=false) => {
            const { r: renderR, c: renderC } = getRenderPos(logicR, logicC);
            const x = ox + renderC * cs;
            const y = oy + renderR * cs;
            const o = cs * 0.08; 
            const l = cs * 0.15; 

            UI.ctx.beginPath();
            if (!hideRight) {
                UI.ctx.moveTo(x+o, y-o-l); UI.ctx.lineTo(x+o, y-o); UI.ctx.lineTo(x+o+l, y-o);
                UI.ctx.moveTo(x+o, y+o+l); UI.ctx.lineTo(x+o, y+o); UI.ctx.lineTo(x+o+l, y+o);
            }
            if (!hideLeft) {
                UI.ctx.moveTo(x-o, y-o-l); UI.ctx.lineTo(x-o, y-o); UI.ctx.lineTo(x-o-l, y-o);
                UI.ctx.moveTo(x-o, y+o+l); UI.ctx.lineTo(x-o, y+o); UI.ctx.lineTo(x-o-l, y+o);
            }
            UI.ctx.stroke();
        };

        drawMark(2, 1); drawMark(2, 7); drawMark(7, 1); drawMark(7, 7);
        drawMark(3, 0, true, false); drawMark(3, 2); drawMark(3, 4); drawMark(3, 6); drawMark(3, 8, false, true);
        drawMark(6, 0, true, false); drawMark(6, 2); drawMark(6, 4); drawMark(6, 6); drawMark(6, 8, false, true);
    }

    function drawBoard() {
        if (!CONFIG.renderSize.cellSize) return; // 尚未计算好尺寸
        
        const w = UI.canvas.width, h = UI.canvas.height;
        UI.ctx.clearRect(0, 0, w, h);
        
        const { offsetX: ox, offsetY: oy, cellSize: cs } = CONFIG.renderSize;

        // 绘制网格
        UI.ctx.strokeStyle = CONFIG.colors.gridLine;
        UI.ctx.lineWidth = 1.5;
        UI.ctx.shadowBlur = 5;
        UI.ctx.shadowColor = CONFIG.colors.gridLine;

        UI.ctx.beginPath();
        for (let i = 0; i < 10; i++) { UI.ctx.moveTo(ox, oy + i*cs); UI.ctx.lineTo(ox + 8*cs, oy + i*cs); }
        for (let i = 0; i < 9; i++) {
            if (i === 0 || i === 8) { UI.ctx.moveTo(ox + i*cs, oy); UI.ctx.lineTo(ox + i*cs, oy + 9*cs); }
            else { UI.ctx.moveTo(ox + i*cs, oy); UI.ctx.lineTo(ox + i*cs, oy + 4*cs); UI.ctx.moveTo(ox + i*cs, oy + 5*cs); UI.ctx.lineTo(ox + i*cs, oy + 9*cs); }
        }
        
        UI.ctx.moveTo(ox + 3*cs, oy); UI.ctx.lineTo(ox + 5*cs, oy + 2*cs);
        UI.ctx.moveTo(ox + 5*cs, oy); UI.ctx.lineTo(ox + 3*cs, oy + 2*cs);
        UI.ctx.moveTo(ox + 3*cs, oy + 7*cs); UI.ctx.lineTo(ox + 5*cs, oy + 9*cs);
        UI.ctx.moveTo(ox + 5*cs, oy + 7*cs); UI.ctx.lineTo(ox + 3*cs, oy + 9*cs);
        UI.ctx.stroke();
        UI.ctx.shadowBlur = 0;

        UI.ctx.fillStyle = CONFIG.colors.boardText;
        UI.ctx.font = `bold ${cs * 0.6}px Arial`;
        UI.ctx.textAlign = "center"; UI.ctx.textBaseline = "middle";
        if (state.isFlipped) {
            UI.ctx.save(); UI.ctx.translate(ox + 4*cs, oy + 4.5*cs); UI.ctx.rotate(Math.PI);
            UI.ctx.fillText("楚 河", 2*cs, 0); UI.ctx.fillText("汉 界", -2*cs, 0); UI.ctx.restore();
        } else {
            UI.ctx.fillText("楚 河", ox + 2*cs, oy + 4.5*cs); UI.ctx.fillText("汉 界", ox + 6*cs, oy + 4.5*cs);
        }

        drawCrossMarks(ox, oy, cs);

        if (state.validMoves.length > 0) {
            UI.ctx.fillStyle = CONFIG.colors.validMove;
            state.validMoves.forEach(m => {
                const rp = getRenderPos(m.r, m.c);
                UI.ctx.beginPath(); UI.ctx.arc(ox + rp.c*cs, oy + rp.r*cs, cs * 0.15, 0, Math.PI * 2); UI.ctx.fill();
            });
        }

        if (state.selectedPiece) {
            UI.ctx.strokeStyle = CONFIG.colors.select; UI.ctx.lineWidth = 3;
            const rp = getRenderPos(state.selectedPiece.r, state.selectedPiece.c);
            // 移动端稍大一点的选中框
            UI.ctx.strokeRect(ox + rp.c*cs - cs*0.48, oy + rp.r*cs - cs*0.48, cs*0.96, cs*0.96);
        }

        const pR = cs * 0.44; // 稍微增大棋子以便点击
        for (let r = 0; r < 10; r++) {
            for (let c = 0; c < 9; c++) {
                const id = state.board[r][c];
                if (id) {
                    const p = PIECES[id];
                    const rp = getRenderPos(r, c);
                    const x = ox + rp.c*cs, y = oy + rp.r*cs;
                    
                    UI.ctx.beginPath(); UI.ctx.arc(x, y, pR, 0, Math.PI*2);
                    UI.ctx.fillStyle = '#1e293b'; UI.ctx.fill();
                    
                    UI.ctx.strokeStyle = p.color === 'red' ? CONFIG.colors.red : CONFIG.colors.black;
                    UI.ctx.lineWidth = 2; UI.ctx.shadowBlur = 8;
                    UI.ctx.shadowColor = p.color === 'red' ? CONFIG.colors.redGlow : CONFIG.colors.blackGlow;
                    UI.ctx.stroke(); UI.ctx.shadowBlur = 0;

                    UI.ctx.beginPath(); UI.ctx.arc(x, y, pR*0.8, 0, Math.PI*2);
                    UI.ctx.strokeStyle = '#334155'; UI.ctx.lineWidth = 1; UI.ctx.stroke();

                    UI.ctx.fillStyle = p.color === 'red' ? CONFIG.colors.red : CONFIG.colors.black;
                    UI.ctx.font = `bold ${cs * 0.45}px -apple-system, "KaiTi", "STKaiti", serif`;
                    UI.ctx.textAlign = "center"; UI.ctx.textBaseline = "middle";
                    
                    UI.ctx.save();
                    UI.ctx.translate(x, y);
                    if (state.isFlipped) UI.ctx.rotate(Math.PI);
                    UI.ctx.fillText(p.text, 0, cs * 0.05);
                    UI.ctx.restore();
                }
            }
        }
    }

    window.onload = init;
})();
</script>
